<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- Gift Box Body -->
    <rect x="16" y="30" width="32" height="26" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Box Lid -->
    <rect x="14" y="24" width="36" height="6" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Vertical Ribbon -->
    <line x1="32" y1="24" x2="32" y2="56" stroke="white" stroke-width="2.5" />
    <!-- Horizontal Ribbon on Box -->
    <line x1="16" y1="43" x2="48" y2="43" stroke="white" stroke-width="2.5" />
    <!-- Bow - Left Loop -->
    <path d="M 32 24 Q 24 20 20 16 Q 18 14 20 12 Q 22 10 24 12 Q 28 16 32 20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bow - Right Loop -->
    <path d="M 32 24 Q 40 20 44 16 Q 46 14 44 12 Q 42 10 40 12 Q 36 16 32 20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bow - Center Knot -->
    <circle cx="32" cy="22" r="2.5" fill="white" stroke="white" stroke-width="1.5" />
    <!-- Bow - Ribbon Tails -->
    <path d="M 28 24 L 24 28 L 22 26" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
    <path d="M 36 24 L 40 28 L 42 26" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
</svg>
